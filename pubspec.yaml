name: Eyeventory
description: "Eyeventory is a smart, intuitive inventory management application built with Flutter and Firebase. It helps you keep track of your groceries, reduce food waste, and manage your kitchen efficiently."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  shared_preferences: ^2.5.4
  fl_chart: ^1.1.1
  flutter_riverpod: ^2.5.1
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
